<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        header {
            text-align: center;
            background-color: #172554;
            color: white;
            padding: 40px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
        }

        .gallery {

            width: 90%;
            max-width: 1200px;

            margin: auto;

            display: grid;

            /*
                Automatically changes
                number of columns.
            */
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
        }

        .gallery-item {

            position: relative;

            overflow: hidden;

            border-radius: 15px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {

            width: 100%;
            height: 280px;

            object-fit: cover;

            display: block;

            transition: transform 0.4s ease;
        }

        /* Image zoom */
        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .caption {

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            padding: 20px;

            background-color: rgba(0, 0, 0, 0.7);

            color: white;

            text-align: center;

            opacity: 0;

            transition: opacity 0.4s ease;
        }

        /* Caption appears on hover */
        .gallery-item:hover .caption {
            opacity: 1;
        }

        footer {
            margin-top: 50px;

            background-color: #172554;
            color: white;

            text-align: center;

            padding: 20px;
        }

        @media (max-width: 600px) {

            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful Moments</p>
    </header>

    <main class="gallery">

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1015/600/400"
                alt="Mountain"
            >
            <div class="caption">Beautiful Mountains</div>
        </article>

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1016/600/400"
                alt="Nature"
            >
            <div class="caption">Peaceful Nature</div>
        </article>

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1018/600/400"
                alt="Forest"
            >
            <div class="caption">Green Forest</div>
        </article>

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1019/600/400"
                alt="Mountain View"
            >
            <div class="caption">Mountain View</div>
        </article>

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1020/600/400"
                alt="Wildlife"
            >
            <div class="caption">Wildlife</div>
        </article>

        <article class="gallery-item">
            <img
                src="https://picsum.photos/id/1024/600/400"
                alt="Animal"
            >
            <div class="caption">Nature and Wildlife</div>
        </article>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
