<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #e0f2fe;

            color: #172033;

            /*
                Flexbox centers the form
                horizontally and vertically.
            */
            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }

        .contact-container {

            width: 100%;
            max-width: 600px;

            background-color: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            border: 2px solid #cbd5e1;

            border-radius: 8px;

            background-color: #f8fafc;

            font-size: 1rem;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.08);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* Focus selector */
        input:focus,
        textarea:focus {

            border-color: #2563eb;

            outline: none;

            box-shadow:
                0 0 8px rgba(37, 99, 235, 0.3);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background-color: #2563eb;

            color: white;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #1e3a8a;
        }

        footer {
            margin-top: 25px;
            color: #475569;
        }

        @media (max-width: 600px) {

            .contact-container {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <main class="contact-container">

        <h1>Contact Us</h1>

        <p class="intro">
            Have a question? Send us a message.
        </p>

        <form action="#" method="post">

            <div class="form-group">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >

            </div>

            <div class="form-group">

                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message..."
                    required
                ></textarea>

            </div>

            <button type="submit">
                Send Message
            </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Contact Page</p>
    </footer>

</body>
</html>
