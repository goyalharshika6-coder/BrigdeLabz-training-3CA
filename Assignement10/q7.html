```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker.css">
</head>
<body>

    <header class="bg-primary text-white py-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h1 class="h3 mb-0">My Task Tracker</h1>
            <span class="badge bg-warning text-dark fs-6">
                Pending: 3
            </span>
        </div>
    </header>

    <main class="container py-5">
        <section class="mx-auto task-panel">
            <h2 class="mb-4">Today's Tasks</h2>

            <!-- Bootstrap list group -->
            <ul class="list-group">

                <li class="list-group-item d-flex justify-content-between align-items-center gap-2">
                    <span>Complete project report</span>
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center gap-2">
                    <span>Review Bootstrap notes</span>
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center gap-2">
                    <span>Organize study materials</span>
                    <span class="badge bg-success">Low</span>
                </li>

            </ul>

            <div class="mt-4">
                <button type="button" class="btn btn-success">
                    Completed
                    <span class="badge bg-light text-dark ms-1">2</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 My Task Tracker</p>
    </footer>

</body>
</html>
