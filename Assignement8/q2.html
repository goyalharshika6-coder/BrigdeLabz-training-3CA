<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<main class="page">

    <h1>CSS Tooltip Demonstration</h1>
    <p>Hover over an item to see its tooltip.</p>

    <section class="tooltip-container">

        <div class="tooltip-box">
            Home
            <span class="tooltip">Go to Home Page</span>
        </div>

        <div class="tooltip-box">
            Profile
            <span class="tooltip">View Profile</span>
        </div>

        <div class="tooltip-box">
            Help
            <span class="tooltip">Get Help</span>
        </div>

        <div class="tooltip-box">
            Settings
            <span class="tooltip">Open Settings</span>
        </div>

    </section>

</main>

</body>
</html>
