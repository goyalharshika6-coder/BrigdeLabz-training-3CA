<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>

<main class="page">

    <section class="ui-card">

        <h1>Quick Search</h1>

        <form class="search-row">

            <label for="search">
                Search
            </label>

            <input
                id="search"
                type="search"
                placeholder="Type something..."
            >

            <button type="submit">
                Search
            </button>

        </form>

        <div class="controls">

            <button>
                Save
            </button>

            <button>
                Share
            </button>

            <select>
                <option>Select Category</option>
                <option>Technology</option>
                <option>Design</option>
                <option>Education</option>
            </select>

        </div>

    </section>

</main>

</body>
</html>
