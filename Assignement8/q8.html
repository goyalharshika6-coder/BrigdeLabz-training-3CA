<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<main class="page">

    <h1>Box-Sizing Comparison</h1>

    <section class="comparison">

        <article class="box content-box">

            <h2>content-box</h2>

            <p>
                Width applies only to the content.
                Padding and border are added to the total size.
            </p>

        </article>

        <article class="box border-box">

            <h2>border-box</h2>

            <p>
                Width includes content, padding and border.
                Total size remains controlled.
            </p>

        </article>

    </section>

    <p class="note">
        Both boxes use the same declared width and padding
        to demonstrate the difference.
    </p>

</main>

</body>
</html>
