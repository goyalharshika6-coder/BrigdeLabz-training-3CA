<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header>
    <h1>Nature Image Showcase</h1>
</header>

<main class="gallery">

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=1" alt="Mountain">
        </div>
        <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=2" alt="Forest">
        </div>
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=3" alt="Lake">
        </div>
        <figcaption>Beautiful Lake</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=4" alt="Beach">
        </div>
        <figcaption>Sunny Beach</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=5" alt="Desert">
        </div>
        <figcaption>Golden Desert</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/500/350?random=6" alt="Waterfall">
        </div>
        <figcaption>Waterfall</figcaption>
    </figure>

</main>

</body>
</html>
