<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi jQuery Widgets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Dashboard</h1></header>

<main>
<section>

    <div class="widget" id="carousel">
        <h2>Carousel Widget</h2>
        <p id="slideText">Slide 1: Welcome to Dashboard</p>
        <button id="nextSlide">Next Slide</button>
    </div>

    <div class="widget" id="notification">
        <h2>Notification Widget</h2>
        <button id="openModal">Open Notification</button>

        <div id="modal" style="display:none">
            <p>You have a new notification!</p>
            <button id="closeModal">Close</button>
        </div>
    </div>

    <div class="widget" id="activeWidget">
        <h2>Active Widget</h2>
        <p>Click here to highlight this widget.</p>
    </div>

    <div class="widget" id="tooltipWidget" title="This is a tooltip">
        <h2>Tooltip Widget</h2>
        <p>Hover over this widget to see tooltip.</p>
    </div>

    <p id="versionInfo"></p>

</section>
</main>

<footer>jQuery Assignment - Q9</footer>

<!-- First jQuery version -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    // Save first jQuery version as jq1
    var jq1 = jQuery.noConflict();
</script>

<!-- Second jQuery version -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    // Save second jQuery version as jq2
    var jq2 = jQuery.noConflict(true);
</script>

<!-- Connect JavaScript file -->
<script src="q9.js"></script>

</body>
</html>
