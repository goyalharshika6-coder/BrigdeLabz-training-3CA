<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page Greeting</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to Our Website</h1>
    </header>

    <main>
        <section>
            <h2 id="greeting">Welcome!</h2>

            <p id="welcomeMessage">
                We are happy to have you here.
                Explore our website and enjoy your visit.
            </p>

            <button id="changeGreeting">Change Greeting</button>

            <button id="toggleWelcome">Toggle Welcome Message</button>
        </section>
    </main>

    <footer>
        <p>jQuery Assignment - Q1</p>
    </footer>

    <!-- Connect jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Connect JavaScript file -->
    <script src="q1.js"></script>

</body>
</html>
