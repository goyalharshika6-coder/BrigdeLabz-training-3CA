<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Subscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Event Subscription Panel</h1></header>

<main>
<section>

    <h2>Subscription Topics</h2>

    <div id="topics">

        <div class="topic">
            <span>Technology Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
            <button class="remove">Remove</button>
        </div>

        <div class="topic">
            <span>Placement Alerts</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
            <button class="remove">Remove</button>
        </div>

        <div class="topic">
            <span>Workshop News</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
            <button class="remove">Remove</button>
        </div>

        <div class="topic">
            <span>Exam Notifications</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
            <button class="remove">Remove</button>
        </div>

        <div class="topic">
            <span>Project Updates</span>
            <button class="subscribe">Subscribe</button>
            <button class="unsubscribe">Unsubscribe</button>
            <button class="remove">Remove</button>
        </div>

    </div>

    <input type="text" id="newTopic" placeholder="Enter new topic">
    <button id="addTopic">Add Topic</button>

    <p id="message" class="success"></p>

</section>
</main>

<footer>jQuery Assignment - Q6</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="q6.js"></script>

</body>
</html>
