<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            margin-bottom: 50px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: steelblue;
            color: white;
            border-radius: 10px;

            /* Smooth transformation */
            transition: all 0.4s ease;
        }

        /* Rotate transformation */
        .rotate:hover {
            transform: rotate(45deg);
        }

        /* Scale transformation */
        .scale:hover {
            transform: scale(1.3);
        }

        /* Translate transformation */
        .translate:hover {
            transform: translateY(-30px);
        }

        /* Skew transformation */
        .skew:hover {
            transform: skew(20deg);
        }

        .label {
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Transformations Showcase</h1>

    <main class="container">

        <div class="item">
            <div class="box rotate">Rotate</div>
            <p class="label">rotate()</p>
        </div>

        <div class="item">
            <div class="box scale">Scale</div>
            <p class="label">scale()</p>
        </div>

        <div class="item">
            <div class="box translate">Translate</div>
            <p class="label">translate()</p>
        </div>

        <div class="item">
            <div class="box skew">Skew</div>
            <p class="label">skew()</p>
        </div>

    </main>

</body>
</html>
