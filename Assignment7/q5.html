<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f2f2f2;
        }

        section {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid blue;
            padding: 10px;
        }

        /* Attribute selector for links beginning with https */
        a[href^="https"] {
            color: green;
        }

        /* :hover pseudo-class */
        button:hover {
            background-color: orange;
        }

        /* :focus pseudo-class */
        input:focus {
            outline: 3px solid lightblue;
        }

        /* :nth-child pseudo-class */
        li:nth-child(2) {
            color: red;
            font-weight: bold;
        }

        /* ::before pseudo-element */
        h2::before {
            content: "★ ";
            color: orange;
        }

        /* ::after pseudo-element */
        h2::after {
            content: " ✓";
            color: green;
        }

        /* Descendant combinator */
        .box p {
            color: purple;
        }

        /* Child combinator */
        .items > li {
            margin: 8px;
        }

        /* Adjacent sibling combinator */
        h3 + p {
            color: blue;
        }

        /* General sibling combinator */
        h3 ~ p {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Advanced CSS Selectors</h1>

    <section>
        <h2>Attribute Selectors</h2>

        <input type="text" placeholder="Text input">

        <br><br>

        <a href="https://www.google.com">Secure Link</a>
    </section>

    <section>
        <h2>Pseudo Classes and Elements</h2>

        <ul>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
        </ul>

        <button>Hover Me</button>
    </section>

    <section>
        <h2>Combinators</h2>

        <div class="box">
            <p>Descendant selector</p>
        </div>

        <ul class="items">
            <li>Child Item 1</li>
            <li>Child Item 2</li>
        </ul>

        <h3>Heading</h3>
        <p>Adjacent sibling paragraph.</p>
        <p>General sibling paragraph.</p>
    </section>

</body>
</html>
