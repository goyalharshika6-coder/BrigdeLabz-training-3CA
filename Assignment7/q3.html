<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px;
            box-sizing: border-box;
        }

        .linear-section {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            background-attachment: fixed;
        }

        .radial-section {
            background: radial-gradient(circle, #ff9966, #ff5e62);
        }

        .content {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 10px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Gradient Background Page</h1>
    </header>

    <main>

        <section class="linear-section">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient that changes
                    from one color to another horizontally.
                </p>
            </div>
        </section>

        <section class="radial-section">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient that spreads
                    from the center outward.
                </p>
            </div>
        </section>

    </main>

    <footer>
        Gradient Background Page
    </footer>

</body>
</html>
