<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .box {
            width: 180px;
            background-color: white;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .solid {
            border: 4px solid blue;
        }

        .dashed {
            border: 4px dashed green;
        }

        .double {
            border: 6px double red;
        }

        .groove {
            border: 6px groove purple;
        }

        .box:hover {
            border-color: orange;
        }

        .rounded {
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <h1>Borders and Padding</h1>

    <main class="container">

        <div class="box solid">
            <h2>Solid</h2>
            <p>Solid border with padding.</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Dashed border with padding.</p>
        </div>

        <div class="box double rounded">
            <h2>Double</h2>
            <p>Double border with rounded corners.</p>
        </div>

        <div class="box groove rounded">
            <h2>Groove</h2>
            <p>Groove border with rounded corners.</p>
        </div>

    </main>

</body>
</html>
