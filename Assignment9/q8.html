<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>

    <h1>CSS Image Filters</h1>

    <main class="gallery">
        <div class="image-card">
            <img src="https://picsum.photos/id/1015/500/350"
                 alt="Original landscape">
            <h2>Original</h2>
        </div>

        <div class="image-card">
            <img class="grayscale"
                 src="https://picsum.photos/id/1015/500/350"
                 alt="Grayscale landscape">
            <h2>Grayscale</h2>
        </div>

        <div class="image-card">
            <img class="sepia"
                 src="https://picsum.photos/id/1015/500/350"
                 alt="Sepia landscape">
            <h2>Sepia</h2>
        </div>

        <div class="image-card">
            <img class="bright"
                 src="https://picsum.photos/id/1015/500/350"
                 alt="Bright landscape">
            <h2>Brightness</h2>
        </div>
    </main>

</body>
</html>
