<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <link rel="stylesheet" href="responsive-dashboard.css">
</head>
<body>

    <header class="topbar">
        <h1>Dashboard</h1>
        <p>Welcome, User!</p>
    </header>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Menu</h2>
            <a href="#">Overview</a>
            <a href="#">Analytics</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="main-content">
            <h2>Overview</h2>

            <section class="stats">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="stat-card">
                    <h3>Revenue</h3>
                    <p>₹25,000</p>
                </div>

                <div class="stat-card">
                    <h3>Orders</h3>
                    <p>320</p>
                </div>
            </section>

            <section class="activity">
                <h2>Recent Activity</h2>
                <p>New user registered.</p>
                <p>New order received.</p>
                <p>Monthly report generated.</p>
            </section>
        </main>

    </div>

</body>
</html>
