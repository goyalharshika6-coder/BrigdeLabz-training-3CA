<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-gallery.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img class="blur"
                     src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
                     alt="Mountain landscape">
                <figcaption>Blur</figcaption>
            </figure>

            <figure>
                <img class="grayscale"
                     src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"
                     alt="Lake and mountains">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure>
                <img class="sepia"
                     src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"
                     alt="Forest">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure>
                <img class="brightness"
                     src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80"
                     alt="Mountain lake">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure>
                <img class="contrast"
                     src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
                     alt="Snowy mountains">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure>
                <img class="hue"
                     src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80"
                     alt="Deer in a forest">
                <figcaption>Hue Rotate</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>CSS Grid | Image Filters | Responsive Design</p>
    </footer>

</body>
</html>
